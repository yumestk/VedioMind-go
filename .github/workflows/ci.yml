name: checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: vediomind
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: vediomind_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U vediomind -d vediomind_test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://vediomind:test_password@localhost:5432/vediomind_test?sslmode=disable
      GIN_MODE: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/server
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: vediomind
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: vediomind_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U vediomind -d vediomind_test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://vediomind:test_password@localhost:5432/vediomind_test?sslmode=disable
      GIN_MODE: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - run: npm run test:e2e:production
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: web/test-results/
          retention-days: 7
  container:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci_password
      PUBLIC_ORIGIN: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait --wait-timeout 120
      - run: docker compose exec -T app node --version && docker compose exec -T app yt-dlp --version
      - run: curl -fsS http://localhost:8080/api/health/ready && curl -fsS -o /dev/null http://localhost:8080/media/123
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down --volumes
        if: always()
