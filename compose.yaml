services:
  app:
    build: .
    environment:
      DATABASE_URL: postgres://vediomind:${POSTGRES_PASSWORD:?Set a URL-safe database password}@postgres:5432/vediomind?sslmode=disable
      HTTP_ADDR: 0.0.0.0:8080
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      APP_ENV: ${APP_ENV:-development}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_CONTEXT_BUDGET: ${AI_CONTEXT_BUDGET:-48000}
      AI_OUTPUT_TOKENS: ${AI_OUTPUT_TOKENS:-4096}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/server", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: vediomind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password}
      POSTGRES_DB: vediomind
    ports:
      - "127.0.0.1:55437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vediomind -d vediomind"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
